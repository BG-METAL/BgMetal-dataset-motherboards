main:
  params:
    - input
  steps:

    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - bucket: ${input.bucket}
          - prefix: ${input.prefix}
          - version: ${input.version}
          - topic: ${"projects/" + project + "/topics/image-processing-step-1-topic"}
          - pageToken: null
          - publishedCount: 0


    - list_objects:
        call: googleapis.storage.v1.objects.list
        args:
          bucket: ${bucket}
          prefix: ${prefix}
          pageToken: ${pageToken}
          maxResults: 100        # 🔑 CLAVE PARA MEMORIA
        result: objects
    
    - extract_images:
        assign:
          - images: ${objects.items}

    - normalize_images:
        switch:
          - condition: ${images == null}
            next: set_empty_images
        next: process_images

    - set_empty_images:
        assign:
          - images: []

    - process_images:
        switch:
          - condition: ${len(images) == 0}
            next: handle_pagination
        next: publish_images

    - publish_images:
        for:
          value: obj
          in: ${images}
          steps:

            - build_payload:
                assign:
                  - payload:
                      version: ${version}
                      bucket: ${bucket}
                      input_path: ${"gs://" + bucket + "/" + obj.name}
                      step: "step-1"

            - publish_message:
                call: googleapis.pubsub.v1.projects.topics.publish
                args:
                  topic: ${topic}
                  body:
                    messages:
                      - data: ${base64.encode(json.encode(payload))}
            - inc_counter:
                assign:
                  - publishedCount: ${publishedCount + 1}

    - handle_pagination:
        switch:
          - condition: ${objects.nextPageToken != null}
            next: set_next_page
        next: clear_page_token

    - set_next_page:
        assign:
          - pageToken: ${objects.nextPageToken}
        next: has_more_pages

    - clear_page_token:
        assign:
          - pageToken: null
        next: has_more_pages

    - has_more_pages:
        switch:
          - condition: ${pageToken != null}
            next: list_objects
        next: done

    - done:
        return:
          status: "OK"
          images_published: ${publishedCount}


